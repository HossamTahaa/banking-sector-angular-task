<header class="app-header">
  <span class="brand">
    <span class="brand-tile" aria-hidden="true">
      <i class="pi pi-building-columns"></i>
    </span>
    <span class="brand-name">Banking Portal</span>
  </span>

  <div class="header-actions">
    <span class="avatar" aria-hidden="true">{{ initials() }}</span>
    <span class="header-user">{{ displayName() }}</span>

    <button pButton type="button" size="small" [outlined]="true" (click)="logout()">
      Sign out
    </button>
  </div>
</header>
